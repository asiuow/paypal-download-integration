<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{{OG_TITLE}} | Invitation</title>
  
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESC}}">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0b0f;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      position: relative;
    }

    .confetti-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: 
        radial-gradient({{THEME_COLOR}}33 1.5px, transparent 1.5px),
        radial-gradient(rgba(255,255,255,0.15) 1px, transparent 1px);
      background-size: 36px 36px, 18px 18px;
      z-index: 1;
    }

    .card-container {
      width: 100%;
      max-width: 440px;
      background: #14141c;
      border: 1px solid #232332;
      border-radius: 28px;
      padding: 24px 20px;
      position: relative;
      z-index: 10;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      text-align: center;
      margin: auto 0;
    }

    .music-bar-prompt {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed {{THEME_COLOR}}88;
      border-radius: 14px;
      padding: 10px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .music-bar-prompt:active {
      transform: scale(0.98);
      background: {{THEME_COLOR}}22;
    }

    .photo-wrapper {
      width: 140px;
      height: 140px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, {{THEME_COLOR}}, #ffffff55);
      box-shadow: 0 8px 25px {{THEME_COLOR}}44;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #1e1e2d;
    }

    .photo-placeholder {
      font-size: 48px;
      color: #9ca3af;
    }

    .badge-event {
      display: inline-block;
      background: {{THEME_COLOR}}22;
      border: 1px solid {{THEME_COLOR}}55;
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
      word-break: break-word;
    }

    .invite-text {
      font-size: 15px;
      color: #d1d5db;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .info-card {
      background: #1c1c24;
      border: 1px solid #2e2e3a;
      border-radius: 16px;
      padding: 12px 8px;
    }

    .info-card span {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .info-card strong {
      font-size: 15px;
      color: #ffffff;
    }

    .location-box {
      background: #181822;
      border: 1px solid #282836;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .location-header {
      font-size: 14px;
      font-weight: 700;
      color: {{THEME_COLOR}};
      margin-bottom: 6px;
    }

    .location-address {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .location-city {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 12px;
    }

    .map-frame {
      width: 100%;
      height: 190px;
      border-radius: 12px;
      border: 1px solid #333344;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .map-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .btn-maps {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }



    footer {
      margin-top: 24px;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="confetti-bg"></div>

  <audio id="bgAudio" loop preload="auto">
    <source src="/audio/celebration.mp3" type="audio/mpeg">
    <source src="/audio/celebration.wav" type="audio/wav">
  </audio>

  <main class="card-container">
    
    <button id="btnMusicBar" class="music-bar-prompt" onclick="toggleMusic()">
      <span id="musicText">Tap here to play music</span>
    </button>

    <div class="photo-wrapper">
      <img id="cardPhoto" src="{{PHOTO}}" alt="{{NAME}}" class="photo-img" onerror="this.style.display='none'; document.getElementById('photoAlt').style.display='block';">
      <div id="photoAlt" class="photo-placeholder" style="display: none;">📷</div>
    </div>

    <div class="badge-event">{{BADGE_TEXT}}</div>
    <h1>{{NAME}}</h1>
    <p class="invite-text">{{HEADLINE_TEXT}}</p>

    <div class="info-grid">
      <div class="info-card">
        <span>Date</span>
        <strong>{{DATE}}</strong>
      </div>
      <div class="info-card">
        <span>Time</span>
        <strong>{{TIME}}</strong>
      </div>
    </div>

    <div class="location-box">
      <div class="location-header">
        <span>Where is the event?</span>
      </div>
      <div class="location-address">{{ADDRESS}}</div>
      <div class="location-city">{{CITY}}, {{PROVINCE}} {{ZIP_CODE}} ({{COUNTRY}})</div>

      <div class="map-frame">
        <iframe id="mapFrame" src="https://www.openstreetmap.org/export/embed.html?bbox=-123.03%2C44.04%2C-122.99%2C44.06&layer=mapnik"></iframe>
      </div>

      <a id="googleMapsBtn" href="https://www.google.com/maps/search/?api=1&query={{MAPS_QUERY_ENCODED}}" target="_blank" class="btn-maps">
        Open in Google Maps / GPS
      </a>
    </div>

    <footer>
      Interactive Digital Invitation
    </footer>

  </main>

  <script>
    const audio = document.getElementById('bgAudio');
    const musicText = document.getElementById('musicText');
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        musicText.innerText = 'Tap to resume music';
      } else {
        audio.play().then(() => {
          isPlaying = true;
          musicText.innerText = 'Music playing... Tap to pause';
        }).catch(() => {
          musicText.innerText = 'Tap here to play music';
        });
      }
    }

    window.addEventListener('click', function initPlay() {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          musicText.innerText = 'Music playing... Tap to pause';
        }).catch(() => {});
      }
      window.removeEventListener('click', initPlay);
    }, { once: true });
  </script>
</body>
</html>
