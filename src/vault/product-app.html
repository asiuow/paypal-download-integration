<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{{OG_TITLE}} | Invitation</title>
  
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESC}}">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f5f3ff 0%, #eef2ff 30%, #fdf2f8 70%, #f0fdf4 100%);
      background-attachment: fixed;
      color: #1e293b;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
      position: relative;
    }

    .confetti-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: 
        radial-gradient({{THEME_COLOR}}33 1.5px, transparent 1.5px),
        radial-gradient(rgba(148, 163, 184, 0.2) 1px, transparent 1px);
      background-size: 36px 36px, 18px 18px;
      z-index: 1;
    }

    .card-container {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-radius: 28px;
      padding: 28px 20px;
      position: relative;
      z-index: 10;
      box-shadow: 
        0 20px 50px rgba(100, 116, 139, 0.12),
        0 8px 20px rgba(100, 116, 139, 0.06);
      text-align: center;
      margin: auto 0;
    }

    .music-bar-prompt {
      width: 100%;
      background: #f8fafc;
      border: 1px dashed {{THEME_COLOR}}88;
      border-radius: 14px;
      padding: 11px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .music-bar-prompt:active {
      transform: scale(0.98);
      background: #f1f5f9;
    }

    .photo-wrapper {
      width: 100%;
      max-width: 260px;
      max-height: 260px;
      margin: 0 auto 16px;
      border-radius: 20px;
      padding: 4px;
      background: linear-gradient(135deg, {{THEME_COLOR}}, #818cf8);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-img {
      width: 100%;
      height: auto;
      max-height: 250px;
      border-radius: 16px;
      object-fit: contain;
      display: block;
      background: #f8fafc;
    }

    .photo-placeholder {
      font-size: 48px;
      color: #94a3b8;
    }

    .badge-event {
      display: inline-block;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.22);
      color: #4f46e5;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #0f172a;
      word-break: break-word;
    }

    .invite-text {
      font-size: 14px;
      color: #475569;
      margin-bottom: 20px;
      line-height: 1.45;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 8px;
    }

    .info-card span {
      display: block;
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .info-card strong {
      font-size: 14px;
      color: #0f172a;
    }

    .location-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
    }

    .location-header {
      font-size: 13px;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 4px;
    }

    .location-address {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
    }

    .location-city {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .map-frame {
      width: 100%;
      height: 190px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .map-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .btn-maps {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.2s ease;
    }

    .btn-maps:hover {
      background: #1d4ed8;
    }

    footer {
      margin-top: 24px;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="confetti-bg"></div>

  <audio id="bgAudio" loop preload="auto">
    <source src="/audio/celebration.mp3" type="audio/mpeg">
    <source src="/audio/celebration.wav" type="audio/wav">
  </audio>

  <main class="card-container">
    
    <button id="btnMusicBar" class="music-bar-prompt" onclick="toggleMusic()">
      <span id="musicText">Tap here to play music</span>
    </button>

    <div class="photo-wrapper">
      <img id="cardPhoto" src="{{PHOTO}}" alt="{{NAME}}" class="photo-img" onerror="this.style.display='none'; document.getElementById('photoAlt').style.display='block';">
      <div id="photoAlt" class="photo-placeholder" style="display: none;">📷</div>
    </div>

    <div class="badge-event">{{BADGE_TEXT}}</div>
    <h1>{{NAME}}</h1>
    <p class="invite-text">{{HEADLINE_TEXT}}</p>

    <div class="info-grid">
      <div class="info-card">
        <span>Date</span>
        <strong>{{DATE}}</strong>
      </div>
      <div class="info-card">
        <span>Time</span>
        <strong>{{TIME}}</strong>
      </div>
    </div>

    <div class="location-box">
      <div class="location-header">
        <span>Where is the event?</span>
      </div>
      <div class="location-address">{{ADDRESS}}</div>
      <div class="location-city">{{CITY}}, {{PROVINCE}} {{ZIP_CODE}} ({{COUNTRY}})</div>

      <div class="map-frame">
        <iframe id="mapFrame" src="https://www.openstreetmap.org/export/embed.html?bbox=-123.03%2C44.04%2C-122.99%2C44.06&layer=mapnik"></iframe>
      </div>

      <a id="googleMapsBtn" href="https://www.google.com/maps/search/?api=1&query={{MAPS_QUERY_ENCODED}}" target="_blank" class="btn-maps">
        Open in Google Maps / GPS
      </a>
    </div>

    <footer>
      Interactive Digital Invitation
    </footer>

  </main>

  <script>
    const audio = document.getElementById('bgAudio');
    const musicText = document.getElementById('musicText');
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        musicText.innerText = 'Tap to resume music';
      } else {
        audio.play().then(() => {
          isPlaying = true;
          musicText.innerText = 'Music playing... Tap to pause';
        }).catch(() => {
          musicText.innerText = 'Tap here to play music';
        });
      }
    }

    window.addEventListener('click', function initPlay() {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          musicText.innerText = 'Music playing... Tap to pause';
        }).catch(() => {});
      }
      window.removeEventListener('click', initPlay);
    }, { once: true });
  </script>
</body>
</html>
